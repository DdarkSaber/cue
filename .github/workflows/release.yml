name: release

# Builds a release-signed Android APK and attaches it to the GitHub release
# for the tag. The signing key comes only from repository secrets; this
# workflow fails instead of ever falling back to the debug key.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the APK to (e.g. v0.4.2)
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set. Refusing to build a release with the debug key."
              missing=1
            fi
          done
          exit "$missing"
      - name: Write keystore and key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload.jks
          test -s android/upload.jks
          # storeFile resolves against the android/app module directory.
          {
            echo "storeFile=../upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - name: Use Java 17
        run: |
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - run: flutter --disable-analytics
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Refuse a debug-signed APK
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          certs="$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="cue-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$asset"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "Cue $TAG"
          fi
          gh release upload "$TAG" "$asset" --clobber
      - name: Remove signing files
        if: always()
        run: rm -f android/upload.jks android/key.properties

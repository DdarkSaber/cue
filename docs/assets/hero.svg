<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">Cue</title>
  <desc id="d">Cue wordmark with the tagline "Your next anime, manhwa or K-drama, one card at a time", format chips, and a fan of abstract poster cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080d"/>
      <stop offset="1" stop-color="#0c1120"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.78" cy="0.30" r="0.55">
      <stop offset="0" stop-color="#7b5cff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#ff5d7a" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff5d7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.05" cy="1.0" r="0.5">
      <stop offset="0" stop-color="#22c7b8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22c7b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="0.5" stop-color="#ff6f91"/>
      <stop offset="1" stop-color="#9d7bff"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1600" height="800" rx="36"/></clipPath>
    <clipPath id="card"><rect x="1050" y="170" width="260" height="390" rx="24"/></clipPath>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <!-- poster palettes -->
    <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb05c"/><stop offset="0.55" stop-color="#e2447a"/><stop offset="1" stop-color="#3a1446"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1fd1c1"/><stop offset="0.6" stop-color="#1663b8"/><stop offset="1" stop-color="#0b1d47"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b48cff"/><stop offset="0.5" stop-color="#6a3df0"/><stop offset="1" stop-color="#1a0f4a"/></linearGradient>
    <linearGradient id="p4" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a8a"/><stop offset="0.6" stop-color="#9b2f6a"/><stop offset="1" stop-color="#25102e"/></linearGradient>
    <linearGradient id="p5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd36b"/><stop offset="0.5" stop-color="#f0713a"/><stop offset="1" stop-color="#3b1610"/></linearGradient>
    <radialGradient id="orb" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="1" stop-color="#ffd9f0" stop-opacity="0.35"/></radialGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="800" fill="url(#bg)"/>
    <rect width="1600" height="800" fill="url(#dots)"/>
    <rect width="1600" height="800" fill="url(#glowA)"/>
    <rect width="1600" height="800" fill="url(#glowB)"/>
    <rect width="1600" height="800" fill="url(#glowC)"/>

    <!-- Left: brand -->
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif">
      <text x="112" y="178" fill="#9aa3b8" font-size="19" font-weight="600" letter-spacing="4">FREE · PRIVATE · POSTER-FIRST</text>

      <!-- mark: open ring with a play triangle -->
      <g transform="translate(112 214)">
        <path d="M78 22 A44 44 0 1 0 78 90" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
        <path d="M44 36 L76 56 L44 76 Z" fill="url(#accent)" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round"/>
      </g>
      <text x="222" y="314" fill="#ffffff" font-size="132" font-weight="800" letter-spacing="-4">cue</text>

      <text x="112" y="410" fill="#eef0f7" font-size="40" font-weight="700" letter-spacing="-0.5">Your next anime, manhwa or K-drama —</text>
      <text x="112" y="466" fill="url(#accent)" font-size="40" font-weight="700" letter-spacing="-0.5">one card at a time.</text>
      <text x="112" y="522" fill="#9aa3b8" font-size="22">A swipe deck that learns your taste. No account, no ads, no trackers.</text>

      <!-- format chips -->
      <g font-size="20" font-weight="600" fill="#e6e9f2" text-anchor="middle">
        <g transform="translate(112 588)">
          <rect width="104" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.20"/>
          <text x="52" y="30">Anime</text>
        </g>
        <g transform="translate(228 588)">
          <rect width="122" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.20"/>
          <text x="61" y="30">Manhwa</text>
        </g>
        <g transform="translate(362 588)">
          <rect width="122" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.20"/>
          <text x="61" y="30">K-drama</text>
        </g>
        <g transform="translate(496 588)">
          <rect width="106" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.20"/>
          <text x="53" y="30">Series</text>
        </g>
        <g transform="translate(614 588)">
          <rect width="112" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.20"/>
          <text x="56" y="30">Movies</text>
        </g>
      </g>
      <text x="112" y="690" fill="#6f7891" font-size="18">Android · Web · Flutter + Cloudflare Workers</text>
    </g>

    <!-- Right: fan of abstract poster cards (pivot below the deck) -->
    <g transform="translate(1250 430) scale(0.88) translate(-1180 -420)">
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Roboto, Arial, sans-serif">

      <!-- card 1: far left, dusk mountains -->
      <g transform="rotate(-26 1180 980)" filter="url(#shadow)">
        <g clip-path="url(#card)">
          <rect x="1050" y="170" width="260" height="390" fill="url(#p1)"/>
          <circle cx="1210" cy="290" r="54" fill="#ffe3a3" fill-opacity="0.85"/>
          <path d="M1050 420 L1120 330 L1170 380 L1230 300 L1310 400 L1310 560 L1050 560 Z" fill="#2a0f36" fill-opacity="0.75"/>
          <path d="M1050 470 L1140 400 L1210 450 L1310 380 L1310 560 L1050 560 Z" fill="#160822" fill-opacity="0.85"/>
          <rect x="1050" y="170" width="260" height="390" fill="url(#shade)"/>
        </g>
        <rect x="1050.5" y="170.5" width="259" height="389" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
      </g>

      <!-- card 5: far right, sunburst grid -->
      <g transform="rotate(26 1180 980)" filter="url(#shadow)">
        <g clip-path="url(#card)">
          <rect x="1050" y="170" width="260" height="390" fill="url(#p5)"/>
          <g stroke="#fff4d6" stroke-opacity="0.22" stroke-width="2">
            <line x1="1050" y1="430" x2="1310" y2="430"/><line x1="1050" y1="460" x2="1310" y2="460"/><line x1="1050" y1="500" x2="1310" y2="500"/>
            <line x1="1180" y1="400" x2="1080" y2="560"/><line x1="1180" y1="400" x2="1140" y2="560"/><line x1="1180" y1="400" x2="1220" y2="560"/><line x1="1180" y1="400" x2="1280" y2="560"/>
          </g>
          <circle cx="1180" cy="330" r="70" fill="#fff1c2" fill-opacity="0.8"/>
          <rect x="1050" y="170" width="260" height="390" fill="url(#shade)"/>
        </g>
        <rect x="1050.5" y="170.5" width="259" height="389" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
      </g>

      <!-- card 2: left, ocean waves -->
      <g transform="rotate(-13 1180 980)" filter="url(#shadow)">
        <g clip-path="url(#card)">
          <rect x="1050" y="170" width="260" height="390" fill="url(#p2)"/>
          <g fill="none" stroke="#c8fff6" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round">
            <path d="M1030 320 q32 -26 64 0 t64 0 t64 0 t64 0 t64 0"/>
            <path d="M1030 360 q32 -26 64 0 t64 0 t64 0 t64 0 t64 0"/>
            <path d="M1030 400 q32 -26 64 0 t64 0 t64 0 t64 0 t64 0"/>
          </g>
          <circle cx="1110" cy="240" r="26" fill="#e9fffb" fill-opacity="0.75"/>
          <rect x="1050" y="170" width="260" height="390" fill="url(#shade)"/>
        </g>
        <rect x="1050.5" y="170.5" width="259" height="389" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
      </g>

      <!-- card 4: right, rose diagonals -->
      <g transform="rotate(13 1180 980)" filter="url(#shadow)">
        <g clip-path="url(#card)">
          <rect x="1050" y="170" width="260" height="390" fill="url(#p4)"/>
          <g fill="#ffffff" fill-opacity="0.10">
            <path d="M1050 300 L1310 180 L1310 220 L1050 340 Z"/>
            <path d="M1050 370 L1310 250 L1310 270 L1050 390 Z"/>
          </g>
          <rect x="1150" y="290" width="110" height="150" rx="55" fill="#ffd0dc" fill-opacity="0.35"/>
          <rect x="1050" y="170" width="260" height="390" fill="url(#shade)"/>
        </g>
        <rect x="1050.5" y="170.5" width="259" height="389" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
      </g>

      <!-- card 3: front and centre, glowing orb -->
      <g filter="url(#shadow)">
        <g clip-path="url(#card)">
          <rect x="1050" y="170" width="260" height="390" fill="url(#p3)"/>
          <circle cx="1180" cy="320" r="120" fill="#ff8fc8" fill-opacity="0.18"/>
          <circle cx="1180" cy="320" r="72" fill="url(#orb)"/>
          <ellipse cx="1180" cy="320" rx="120" ry="22" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" transform="rotate(-18 1180 320)"/>
          <path d="M1050 470 C1110 430 1160 470 1200 450 C1240 430 1280 440 1310 430 L1310 560 L1050 560 Z" fill="#120a35" fill-opacity="0.8"/>
          <rect x="1050" y="170" width="260" height="390" fill="url(#shade)"/>
        </g>
        <rect x="1050.5" y="170.5" width="259" height="389" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.28"/>
        <!-- card chrome -->
        <rect x="1070" y="190" width="78" height="30" rx="8" fill="#0a0b12" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.35"/>
        <text x="1109" y="211" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Anime</text>
        <rect x="1072" y="474" width="168" height="18" rx="9" fill="#ffffff" fill-opacity="0.92"/>
        <rect x="1072" y="504" width="56" height="12" rx="6" fill="#ffffff" fill-opacity="0.55"/>
        <rect x="1136" y="504" width="70" height="12" rx="6" fill="#ffffff" fill-opacity="0.55"/>
        <rect x="1072" y="528" width="96" height="16" rx="8" fill="#7cf0c8" fill-opacity="0.30"/>
      </g>

      <!-- swipe actions under the deck -->
      <g transform="translate(1180 690)">
        <g transform="translate(-150 0)">
          <circle r="27" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.25"/>
          <path d="M-8 -8 L8 8 M8 -8 L-8 8" stroke="#ff8a9b" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g transform="translate(-50 0)">
          <circle r="27" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.25"/>
          <path d="M0 -10 L0 10 M-7 3 L0 10 L7 3" fill="none" stroke="#dfe3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(50 0)">
          <circle r="27" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.25"/>
          <path d="M-9 1 L-3 7 L9 -6" fill="none" stroke="#7cf0c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(150 0)">
          <circle r="30" fill="#ffffff"/>
          <path d="M-10 0 L10 0 M3 -7 L10 0 L3 7" fill="none" stroke="#0b0d14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
    </g>
  </g>
</svg>

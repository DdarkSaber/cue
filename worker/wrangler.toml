name = "cue-worker"
main = "src/index.ts"
compatibility_date = "2026-11-03"

# Comma-separated app origins allowed by CORS. Native apps send no Origin.
# Production origins are added at deploy time.
[vars]
ALLOWED_ORIGINS = "https://cue-next.cue-worker.workers.dev"
# Public OAuth client id (it is visible in the sign-in URL). The secret is a wrangler secret.
MAL_CLIENT_ID = "5910123f3d7045299259209ddff88344"

# Public catalog cache only. Never personal data.
[[kv_namespaces]]
binding = "CATALOG_CACHE"
id = "a5e8ed98c574457982805784f20956a2"

# Encrypted sync blobs (M8), diagnostics and AI daily counters. Schema in migrations/;
# apply with `wrangler d1 migrations apply SYNC_DB --remote` before each deploy.
[[d1_databases]]
binding = "SYNC_DB"
database_name = "cue-sync"
database_id = "e88a13c1-dcc1-4781-8697-ff1a1100ed8c"
migrations_dir = "migrations"

# Per-IP limit via Cloudflare's rate-limiting binding (not KV).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# /ai/mood and /ai/recommend spend free AI quota: 10 a minute per IP.
[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# /catalog/match and /catalog/aliases fan out to many providers per request.
[[ratelimits]]
name = "HEAVY_LIMITER"
namespace_id = "1004"
simple = { limit = 20, period = 60 }

# /catalog/mal-search and /catalog/names: up to 8 cached lookups each, paced by the app.
[[ratelimits]]
name = "LOOKUP_LIMITER"
namespace_id = "1005"
simple = { limit = 30, period = 60 }

# Creating a sync copy (PUT /sync/:id at version 0) takes D1 space: 5 a minute per IP.
# Updates of an existing copy keep the general limit.
[[ratelimits]]
name = "SYNC_CREATE_LIMITER"
namespace_id = "1006"
simple = { limit = 5, period = 60 }

# Posters on the web app load in bursts; a separate, looser limit.
[[ratelimits]]
name = "IMAGE_LIMITER"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

# Secrets (set with `wrangler secret put`, never committed):
#   TMDB_API_KEY (M1), MAL_CLIENT_SECRET (M6), GROQ_API_KEY, GEMINI_API_KEY (M7); optional GROQ_MODEL, GEMINI_MODEL vars

# Weekly: delete encrypted sync copies untouched for 180 days.
[triggers]
crons = ["0 3 * * SUN"]

# Logs and traces in the Cloudflare dashboard.
[observability]
enabled = true

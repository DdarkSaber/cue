name = "cue-worker"
main = "src/index.ts"
compatibility_date = "2026-08-15"

# Comma-separated app origins allowed by CORS. Native apps send no Origin.
# Production origins are added at deploy time.
[vars]
ALLOWED_ORIGINS = "https://cue-next.cue-worker.workers.dev,http://localhost:7357,http://127.0.0.1:7357"
# Public OAuth client id (it is visible in the sign-in URL). The secret is a wrangler secret.
MAL_CLIENT_ID = "5910123f3d7045299259209ddff88344"

# Public catalog cache only. Never personal data.
[[kv_namespaces]]
binding = "CATALOG_CACHE"
id = "a5e8ed98c574457982805784f20956a2"

# Encrypted sync blobs (M8). Schema in migrations/.
[[d1_databases]]
binding = "SYNC_DB"
database_name = "cue-sync"
database_id = "e88a13c1-dcc1-4781-8697-ff1a1100ed8c"
migrations_dir = "migrations"

# Per-IP limit via Cloudflare's rate-limiting binding (not KV).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# /ai/mood spends free AI quota: 10 a minute per IP.
[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# Posters on the web app load in bursts; a separate, looser limit.
[[ratelimits]]
name = "IMAGE_LIMITER"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

# Secrets (set with `wrangler secret put`, never committed):
#   TMDB_API_KEY (M1), MAL_CLIENT_SECRET (M6), GEMINI/GROQ keys (M7)

name = "cue-worker"
main = "src/index.ts"
compatibility_date = "2026-08-15"

# Comma-separated app origins allowed by CORS. Native apps send no Origin.
# Production origins are added at deploy time.
[vars]
ALLOWED_ORIGINS = "http://localhost:7357,http://127.0.0.1:7357"

# Public catalog cache only. Never personal data.
# Replace the id with the real namespace before the first deploy (M1).
[[kv_namespaces]]
binding = "CATALOG_CACHE"
id = "00000000000000000000000000000000"

# Encrypted sync blobs (M8). Schema in migrations/.
[[d1_databases]]
binding = "SYNC_DB"
database_name = "cue-sync"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Per-IP limit via Cloudflare's rate-limiting binding (not KV).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Posters on the web app load in bursts; a separate, looser limit.
[[ratelimits]]
name = "IMAGE_LIMITER"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

# Secrets (set with `wrangler secret put`, never committed):
#   TMDB_API_KEY (M1), MAL/ANILIST/TRAKT client secrets (M6), GEMINI/GROQ keys (M7)
